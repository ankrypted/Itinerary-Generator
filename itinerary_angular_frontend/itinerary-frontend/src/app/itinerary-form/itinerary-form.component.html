<div class="container">
    <h1>Itinerary Generator</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="destination">Destination:</label>
        <input
          type="text"
          id="destination"
          [(ngModel)]="destination"
          name="destination"
          required
          placeholder="Enter destination"
        />
      </div>
      <div class="form-group">
        <label for="duration">Duration (days):</label>
        <input
          type="number"
          id="duration"
          [(ngModel)]="duration"
          name="duration"
          required
          placeholder="Enter duration"
        />
      </div>
      <div class="form-group">
        <label for="preferences">Preferences:</label>
        <textarea
          id="preferences"
          [(ngModel)]="preferences"
          name="preferences"
          placeholder="Enter preferences (e.g., museums, cafes)"
        ></textarea>
      </div>
      <button type="submit">Generate Itinerary</button>
    </form>
  
    <div *ngIf="itinerary" class="itinerary-result">
      <h2>Your Itinerary:</h2>
      <pre>{{ itinerary }}</pre>
    </div>
  </div>
