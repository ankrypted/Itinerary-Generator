spring.application.name=itinerary-backend
spring.security.oauth2.client.registration.google.scope=email,profile
logging.level.org.springframework.security=DEBUG
logging.level.com.example.auth.config=DEBUG
#logging.level.root=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.com.example.itinerary_backend=DEBUG
logging.level.com.example.auth=INFO
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.datasource.url=jdbc:postgresql://localhost:5432/itinerary_generator
spring.datasource.username=postgres

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
